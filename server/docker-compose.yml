services:
  db:
    image: postgres:15-alpine
    container_name: task-server-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: task-server-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/task_db?schema=public
      - PORT=5000
      - BCRYPT_SALT_ROUND=10
      - JWT_ACCESS_SECRET=b418f7a3daa6a05deaaa268aa5baabb7186851310c1db689c0ea20fe8de45cbe
      - JWT_ACCESS_EXPIRES=15d
      - JWT_REFRESH_SECRET=b6bf8c12c86d6d2dde3c98a8767776d7af4fa9486464fe276921518d54c69f76dd8f59f3ed94fdf724cfd85e339c0dbc726c26abf587d9c676b41001bfeecb51
      - JWT_REFRESH_EXPIRES=30d
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - db

volumes:
  postgres_data:
